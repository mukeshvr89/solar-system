################# Create Workflows #############

name: Solar System Workflow
on:
  workflow_dispatch: 
  push: 
    branches: 
      - main
      - 'feature/*'
# Define enviornmental variables at workflow level #
env:
  MONGO_URI: 'mongodb+srv://supercluster.d83jj.mongodb.net/superData'
  MONGO_USERNAME: ${{ vars.MONGO_USERNAME }}
  MONGO_PASSWORD: ${{ secrets.MONGO_PASSWORD }} 
jobs:
  unit-testing:
    strategy:
      matrix:
        node-version: [18]
        os: [ubuntu-latest] 
    runs-on: ${{ matrix.os }}
    steps:
      - name: checkout workspace
        uses: actions/checkout@v4
      - name: Setup Node json version ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - name: Cache npm  dependecy
        uses: actions/cache@v4
        with:
          path: node_modules
          key: ${{ runner.os }}-node-modules-${{ matrix.node-version }}-${{ hashFiles('package-lock.json') }}
      - name: Install Dependencies
        run: npm install
      - name: Unit testing
        id: unit-test-id
        run: npm test
      - name: Archive test result
        #if: failure() && (steps.unit-test-id.outcome == 'success' || steps.unit-test-id.outcome == 'failure')
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Mocha-Test-Result${{ matrix.node-version}}-${{matrix.os}}
          path: test-results.xml
  
  code-coverage:
    runs-on: ubuntu-latest
    steps:
      - name: checkout Respository
        uses: actions/checkout@v4
      - name: Setup Node json version 
        uses: actions/setup-node@v4
        with:
          node-version: 18
      - name: Cache npm  dependecy
        uses: actions/cache@v4
        with:
          path: node_modules
          key: ${{ runner.os }}-node-modules-${{ runner.arch }}-${{ hashFiles('package-lock.json') }}
      - name: Install Dependencies
        run: npm install
      - name: Code coverage
        continue-on-error: true ### Job will be continue if error occures, so next job will also run and upload the covergage report else next step will fail#
        run: npm run coverage
      - name: Archive test result
        uses: actions/upload-artifact@v4
        with:
          name: Code-Coverage-Result
          path: coverage
          retention-days: 5
     
  containerization:
    needs: [unit-testing, code-coverage]
    runs-on: ubuntu-latest
    permissions: 
      packages: write
    steps:
      - name: checkout Respository
        uses: actions/checkout@v4
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}
      
      - name: Login to Docker Hub container Registery Login (ghcr.io)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker build
        uses: docker/build-push-action@v6
        with:
          context: .   # check for Docker file in Current Directory #
          push: false
          tags: |
                ${{ vars.DOCKERHUB_USERNAME }}/solar-system:${{ github.sha }}
                

      - name: Docker image testing
        run: |
             docker run --name solar-system-app -d -p 3000:3000 \
             -e MONGO_URI=${MONGO_URI} \
             -e MONGO_USERNAME=${MONGO_USERNAME} \
             -e MONGO_PASSWORD=${MONGO_PASSWORD} \
             ${{ vars.DOCKERHUB_USERNAME }}/solar-system:${{ github.sha }}

             export IP=$(docker inspect -f '{{range .NetworkSettings.Networks}}{{.IPAddress}}{{end}}' solar-system-app)
             echo "Container IP: $IP"
             echo "Testing Image URI using wget..."
             for i in {1..10}; do
             if wget -q -O - http://$IP:3000/live | grep live; then
             echo "Service is live!"
             exit 0
             else
             echo "Attempt $i: Service not ready yet..."
             sleep 3
             fi
             done
             echo "Service did not respond in time"
             exit 1
      
      - name: Docker push
        uses: docker/build-push-action@v6
        with:
          context: .   # check for Docker file in Current Directory #
          push: true
          tags: |
                ${{ vars.DOCKERHUB_USERNAME }}/solar-system:${{ github.sha }}
                ghcr.io/${{ github.repository_owner }}/solar-system:${{ github.sha }}